<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cobra</title>
<style>
  html, body { margin: 0; height: 100%; background: #080b13; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; touch-action: none; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- Configuração ----------
const C = 20, R = 20, S = 28, M = 20, H = 70;
const W = C * S + M * 2, HT = H + R * S + M;
const BW = C * S, BH = R * S;
const FONT = '"Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = HT * dpr;
cv.style.width = W + 'px'; cv.style.height = HT + 'px';
ctx.scale(dpr, dpr);
function ajustar() {
  const k = Math.min(innerWidth / W, innerHeight / HT, 1.4);
  cv.style.width = W * k + 'px'; cv.style.height = HT * k + 'px';
}
addEventListener('resize', ajustar); ajustar();

const CORES = {
  a: '#18262c', b: '#1c2c33',
  cabeca: [110, 240, 140], corpo: [70, 205, 120], cauda: [26, 125, 95],
  ouro: '#ffcd50', suave: '#96a5b9'
};

// ---------- Estado ----------
let estado = 'menu'; // menu | jogando | pausado | fim
let cobra = [], dx = 1, dy = 0, fila = [];
let maca = { x: 0, y: 0 }, pontos = 0, recorde = 0, novoRecorde = false, vitoria = false;
let particulas = [], tremorAte = 0, ultimoPasso = 0;
try { recorde = parseInt(localStorage.getItem('cobra-recorde')) || 0; } catch (e) {}

const atraso = () => Math.max(65, 150 - pontos * 3);
const px = c => M + c * S, py = l => H + l * S;

function cobraMenu() {
  const l = R - 3;
  cobra = [0, 1, 2, 3].map(i => ({ x: C / 4 + 3 - i, y: l }));
  dx = 1; dy = 0; fila = [];
  maca = { x: C / 4 + 8, y: l };
}
cobraMenu();

function novaPartida() {
  const cy = R / 2;
  cobra = [0, 1, 2].map(i => ({ x: C / 4 - i, y: cy }));
  dx = 1; dy = 0; fila = []; pontos = 0; novoRecorde = false; vitoria = false; particulas = [];
  sortearMaca(); estado = 'jogando'; ultimoPasso = performance.now();
}

function sortearMaca() {
  const ocupado = new Set(cobra.map(p => p.x + ',' + p.y));
  const livres = [];
  for (let x = 0; x < C; x++) for (let y = 0; y < R; y++) if (!ocupado.has(x + ',' + y)) livres.push({ x, y });
  if (livres.length) maca = livres[Math.floor(Math.random() * livres.length)];
}

function passo() {
  const d = fila.shift();
  if (d) { dx = d[0]; dy = d[1]; }
  const nx = cobra[0].x + dx, ny = cobra[0].y + dy;
  const comeu = nx === maca.x && ny === maca.y;
  let bateu = nx < 0 || nx >= C || ny < 0 || ny >= R;
  if (!bateu) {
    // se não cresce, a ponta da cauda sai do lugar e não conta como obstáculo
    const limite = comeu ? cobra.length : cobra.length - 1;
    for (let i = 0; i < limite; i++) if (cobra[i].x === nx && cobra[i].y === ny) { bateu = true; break; }
  }
  if (bateu) return terminar(false);
  cobra.unshift({ x: nx, y: ny });
  if (!comeu) { cobra.pop(); return; }
  pontos++;
  explodir(px(nx) + S / 2, py(ny) + S / 2, [255, 80, 90], 16);
  if (cobra.length >= C * R) terminar(true); else sortearMaca();
}

function terminar(venceu) {
  estado = 'fim'; vitoria = venceu;
  if (pontos > recorde) {
    recorde = pontos; novoRecorde = true;
    try { localStorage.setItem('cobra-recorde', recorde); } catch (e) {}
  }
  if (!venceu) {
    tremorAte = performance.now() + 380;
    explodir(px(cobra[0].x) + S / 2, py(cobra[0].y) + S / 2, CORES.cabeca, 22);
  }
}

function pausar() {
  if (estado === 'jogando') estado = 'pausado';
  else if (estado === 'pausado') { estado = 'jogando'; ultimoPasso = performance.now(); }
}

function direcao(x, y) {
  if (estado !== 'jogando') return;
  const ref = fila.length ? fila[fila.length - 1] : [dx, dy];
  const oposta = x === -ref[0] && y === -ref[1], igual = x === ref[0] && y === ref[1];
  if (!oposta && !igual && fila.length < 2) fila.push([x, y]);
}

function explodir(x, y, cor, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3.5;
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 3 + Math.random() * 4, vida: 1, cor });
  }
}

// ---------- Entrada ----------
const TECLAS = {
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1]
};
addEventListener('keydown', e => {
  if (TECLAS[e.key]) { e.preventDefault(); direcao(...TECLAS[e.key]); }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') pausar();
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (estado === 'menu' || estado === 'fim') novaPartida(); else if (estado === 'pausado') pausar();
  }
});
// Celular: toque inicia/reinicia; deslizar o dedo muda a direção
let toque = null;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  toque = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (estado === 'menu' || estado === 'fim') novaPartida(); else if (estado === 'pausado') pausar();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!toque) return;
  const ddx = e.touches[0].clientX - toque.x, ddy = e.touches[0].clientY - toque.y;
  if (Math.abs(ddx) < 24 && Math.abs(ddy) < 24) return;
  if (Math.abs(ddx) > Math.abs(ddy)) direcao(ddx > 0 ? 1 : -1, 0); else direcao(0, ddy > 0 ? 1 : -1);
  toque = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: false });
addEventListener('blur', () => { if (estado === 'jogando') pausar(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && estado === 'jogando') pausar(); });

// ---------- Desenho ----------
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function fundo() {
  const g = ctx.createLinearGradient(0, 0, 0, HT);
  g.addColorStop(0, '#101624'); g.addColorStop(1, '#080b13');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HT);
}

function cartao(x, rotulo, valor, cor) {
  const y = 12, w = 112, h = 46;
  ctx.fillStyle = 'rgba(255,255,255,.055)'; rr(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'left'; ctx.font = `bold 11px ${FONT}`; ctx.fillStyle = CORES.suave;
  ctx.fillText(rotulo, x + 14, y + 18);
  ctx.font = `bold 20px ${FONT}`; ctx.fillStyle = cor; ctx.fillText(valor, x + 14, y + h - 9);
}

function hud() {
  ctx.font = `bold 30px ${FONT}`; ctx.textAlign = 'left';
  const g = ctx.createLinearGradient(0, 18, 0, 46);
  g.addColorStop(0, rgb(CORES.cabeca)); g.addColorStop(1, rgb(CORES.cauda));
  ctx.fillStyle = g; ctx.fillText('COBRA', M, 46);
  cartao(W - M - 112 - 10 - 112, 'PONTOS', pontos, rgb(CORES.cabeca));
  cartao(W - M - 112, 'RECORDE', recorde, CORES.ouro);
}

function tabuleiro() {
  for (let i = 6; i >= 1; i--) {
    ctx.strokeStyle = 'rgba(90,230,140,.03)'; ctx.lineWidth = i * 2.2;
    rr(M, H, BW, BH, 18); ctx.stroke();
  }
  ctx.save(); rr(M, H, BW, BH, 18); ctx.clip();
  for (let c = 0; c < C; c++) for (let l = 0; l < R; l++) {
    ctx.fillStyle = (c + l) % 2 === 0 ? CORES.a : CORES.b; ctx.fillRect(px(c), py(l), S, S);
  }
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(110,240,150,.35)'; rr(M, H, BW, BH, 18); ctx.stroke();
}

function desenharMaca(t) {
  const cx = px(maca.x) + S / 2, cy = py(maca.y) + S / 2 + 1;
  const r = S * 0.36 * (1 + 0.06 * Math.sin(t / 1000 * 5));
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 26);
  g.addColorStop(0, 'rgba(255,70,90,.35)'); g.addColorStop(1, 'rgba(255,70,90,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - 26, cy - 26, 52, 52);
  g = ctx.createRadialGradient(cx - r * .3, cy - r * .4, 0, cx - r * .3, cy - r * .4, r * 1.7);
  g.addColorStop(0, '#ff8282'); g.addColorStop(.55, '#e42a3c'); g.addColorStop(1, '#960a28');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.47)'; ctx.beginPath();
  ctx.ellipse(cx - r * .33, cy - r * .5, r * .22, r * .15, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6e4628'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy - r + 2); ctx.lineTo(cx + 2, cy - r - 5); ctx.stroke();
  ctx.save(); ctx.translate(cx + 2, cy - r - 3); ctx.rotate(-0.45);
  ctx.fillStyle = '#5ac85a'; ctx.beginPath(); ctx.ellipse(5, -0.3, 5, 2.7, 0, 0, 7); ctx.fill();
  ctx.restore();
}

function desenharCobra(t) {
  const n = cobra.length, f = 2, tam = S - f * 2;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  for (const p of cobra) { rr(px(p.x) + f, py(p.y) + f + 3, tam, tam, 14); ctx.fill(); }
  for (let i = n - 1; i >= 0; i--) {
    const p = cobra[i], x = px(p.x), y = py(p.y);
    ctx.fillStyle = rgb(i === 0 ? CORES.cabeca : mix(CORES.corpo, CORES.cauda, n > 1 ? i / (n - 1) : 0));
    if (i > 0) {
      const q = cobra[i - 1], qx = px(q.x), qy = py(q.y);
      if (qy === y) ctx.fillRect(Math.min(x, qx) + S / 2, y + f, S, tam);
      else ctx.fillRect(x + f, Math.min(y, qy) + S / 2, tam, S);
    }
    const e = i === 0 ? 1 : 0;
    rr(x + f - e, y + f - e, tam + e * 2, tam + e * 2, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(x + 6, y + 5, S - 12, S / 2 - 5, 8); ctx.fill();
  }
  rosto(t);
}

function rosto(t) {
  const cx = px(cobra[0].x) + S / 2, cy = py(cobra[0].y) + S / 2;
  const fx = dx, fy = dy, lx = -dy, ly = dx;
  if (estado === 'jogando' && Math.floor(t / 1000 * 6) % 4 === 0) {
    const ex = cx + fx * 20, ey = cy + fy * 20;
    ctx.strokeStyle = '#eb3c50'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx + fx * 13, cy + fy * 13); ctx.lineTo(ex, ey);
    ctx.lineTo(ex + fx * 3 + lx * 3, ey + fy * 3 + ly * 3); ctx.moveTo(ex, ey);
    ctx.lineTo(ex + fx * 3 - lx * 3, ey + fy * 3 - ly * 3); ctx.stroke();
  }
  for (const lado of [-1, 1]) {
    const ox = cx + fx * 4 + lx * 6.5 * lado, oy = cy + fy * 4 + ly * 6.5 * lado;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ox, oy, 4.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#0f141e'; ctx.beginPath(); ctx.arc(ox + fx * 1.5, oy + fy * 1.5, 2.2, 0, 7); ctx.fill();
  }
}

function desenharParticulas() {
  for (const p of particulas) {
    ctx.fillStyle = rgb(p.cor, Math.max(0, p.vida));
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, p.t * p.vida) / 2, 0, 7); ctx.fill();
  }
}

function texto(s, tam, cor, y, peso = 'bold') {
  ctx.font = `${peso} ${tam}px ${FONT}`; ctx.textAlign = 'center';
  const x = M + BW / 2;
  ctx.fillStyle = 'rgba(0,0,0,.43)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = cor; ctx.fillText(s, x, y);
}
function piscando(s, y, t) {
  const a = Math.max(0, Math.min(1, (150 + 105 * Math.sin(t / 1000 * 4)) / 255));
  texto(s, 17, `rgba(255,255,255,${a})`, y);
}

function overlay(t) {
  if (estado === 'jogando') return;
  ctx.fillStyle = 'rgba(6,9,16,' + (estado === 'pausado' ? .67 : .74) + ')';
  rr(M, H, BW, BH, 18); ctx.fill();
  const m = H + BH / 2;
  if (estado === 'menu') {
    const g = ctx.createLinearGradient(0, m - 110, 0, m - 50);
    g.addColorStop(0, rgb(CORES.cabeca)); g.addColorStop(1, rgb(CORES.cauda));
    texto('COBRA', 68, g, m - 60);
    texto('Coma as maçãs e não bata em nada!', 16, CORES.suave, m - 25, 'normal');
    texto('WASD ou SETAS  ›  mover', 14, '#fff', m + 25);
    texto('P ou ESC  ›  pausar', 14, '#fff', m + 48);
    piscando('Pressione ESPAÇO ou toque para começar', m + 110, t);
  } else if (estado === 'pausado') {
    texto('PAUSADO', 48, '#fff', m - 5);
    piscando('Pressione P para continuar', m + 40, t);
  } else {
    if (vitoria) texto('VITÓRIA!', 54, CORES.ouro, m - 70); else texto('FIM DE JOGO', 50, '#ff555f', m - 70);
    texto('Pontos: ' + pontos, 24, '#fff', m - 15);
    if (novoRecorde) texto('★ NOVO RECORDE! ★', 20, CORES.ouro, m + 22);
    else texto('Recorde: ' + recorde, 18, CORES.suave, m + 22, 'normal');
    piscando('ESPAÇO ou toque para jogar de novo', m + 85, t);
  }
}

// ---------- Loop principal ----------
function quadro(t) {
  if (estado === 'jogando' && t - ultimoPasso >= atraso()) { ultimoPasso = t; passo(); }
  for (const p of particulas) { p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .98; p.vida -= .03; }
  particulas = particulas.filter(p => p.vida > 0);

  fundo(); hud();
  ctx.save();
  if (t < tremorAte) ctx.translate(Math.random() * 6 - 3, Math.random() * 6 - 3);
  tabuleiro(); desenharMaca(t); desenharCobra(t); desenharParticulas(); overlay(t);
  ctx.restore();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
